<div class="container-fluid page-header mb-5 position-relative overlay-bottom">
    <div class="d-flex flex-column align-items-center justify-content-center pt-0 pt-lg-5" style="min-height: 400px">
        <h1 class="display-4 mb-3 mt-0 mt-lg-5 text-white text-uppercase">Login</h1>
        <div class="d-inline-flex mb-lg-5">
            <p class="m-0 text-white"><a class="text-white" href="#/home">Home</a></p>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="section-title">
                <h4 class="text-primary text-uppercase" style="letter-spacing: 5px;">Account</h4>
                <h1 class="display-4">Sign in</h1>
            </div>
            <form onsubmit="alert('Login will issue a JWT in Milestone 4. Test accounts will be listed in the README.'); return false;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control p-4" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control p-4" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block font-weight-bold py-3">Sign in</button>
            </form>
            <p class="mt-3">No account? <a href="#/register">Register</a></p>
            <p class="small text-muted">Roles planned: <strong>admin</strong> (full CRUD) and <strong>customer</strong> (own orders, reservations, reviews).</p>
        </div>
    </div>
</div>
