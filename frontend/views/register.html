<div class="container-fluid page-header mb-5 position-relative overlay-bottom">
    <div class="d-flex flex-column align-items-center justify-content-center pt-0 pt-lg-5" style="min-height: 400px">
        <h1 class="display-4 mb-3 mt-0 mt-lg-5 text-white text-uppercase">Register</h1>
        <div class="d-inline-flex mb-lg-5">
            <p class="m-0 text-white"><a class="text-white" href="#/home">Home</a></p>
            <p class="m-0 text-white px-2">/</p>
            <p class="m-0 text-white">Register</p>
        </div>
    </div>
</div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="section-title">
                <h4 class="text-primary text-uppercase" style="letter-spacing: 5px;">Account</h4>
                <h1 class="display-4">Create account</h1>
            </div>
            <form onsubmit="alert('Registration will hash passwords and create a customer user in Milestone 4.'); return false;">
                <div class="form-group">
                    <label>First name</label>
                    <input type="text" class="form-control p-4" required>
                </div>
                <div class="form-group">
                    <label>Last name</label>
                    <input type="text" class="form-control p-4" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control p-4" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" class="form-control p-4" placeholder="+387...">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control p-4" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block font-weight-bold py-3">Register</button>
            </form>
            <p class="mt-3">Already have an account? <a href="#/login">Login</a></p>
        </div>
    </div>
</div>
